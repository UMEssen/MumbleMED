[project]
name = "mumblemed"
version = "0.1.0"
description = "Generate medical speech datasets for ASR fine-tuning using LLM and TTS (no recorded speech required)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10.12, <3.13"
dependencies = [
    "nltk>=3.9.1,<4.0.0",
    "python-dotenv>=1.1.0,<2.0.0",
    "openai>=1.88.0,<2.0.0",
    "safetensors>=0.5.3,<0.6.0",
    "huggingface-hub>=0.33.1,<0.34.0",
    "chatterbox-tts>=0.1.2,<0.2.0",
    "numpy==1.26.4",
    "torch==2.6.0",
    "torchaudio==2.6.0",
    "torchvision==0.21.0",
    "tqdm>=4.67.1,<5.0.0",
    "pydub>=0.25.1,<0.26.0",
    "pandas>=2.3.3,<3.0.0",
    "soundfile>=0.13.1,<0.14.0",
    "pyyaml>=6.0.0,<7.0.0",
    "ml-dtypes>=0.5.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=4.0,<7.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=4.0,<7.0",
]

[project.scripts]
mumblemed = "mumblemed.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.extra-build-dependencies]
pkuseg = ["numpy"]

[build-system]
requires = ["setuptools>=80.9.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mumblemed*"]
